<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BetterMV 场景一览</title>
<style>
/* docs/images/scenes.jpg: the settings page's scene sketches (public/previews/, the original demo cover and made-up
   words), grouped as the settings page groups them, 8 to a row, each group under its name. 1760 wide, as tall as the
   groups need (film/render.ts shoots the whole page); shown 880 wide in the README (so 2x there). */
@font-face { font-family: PF; src: local("PingFang SC Semibold"), local("PingFangSC-Semibold"), local("PingFang SC Bold"); font-weight: 600; }
@font-face { font-family: PF; src: local("PingFang SC Medium"), local("PingFangSC-Medium"); font-weight: 500; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1760px; background: #07070a; color: #fff; font-family: PF, "Noto Sans SC", "Microsoft YaHei UI", sans-serif; -webkit-font-smoothing: antialiased; }
main { padding: 34px 32px 26px; }
section { margin-bottom: 26px; }
h2 { margin: 0 0 14px 2px; font-size: 19px; font-weight: 600; color: rgba(255,255,255,.62); }
.grid { display: grid; grid-template-columns: repeat(8, 198px); gap: 18px 16px; }
figure img { display: block; width: 198px; height: 111.375px; object-fit: cover; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 10px 26px rgba(0,0,0,.5); }
figcaption { margin-top: 10px; font-size: 17px; font-weight: 600; }
</style>
</head>
<body>
<main id="main"></main>
<script type="module">
import { SCENE_GROUPS } from '../src/scenes/catalog.ts';
const main = document.getElementById('main');
for (const g of SCENE_GROUPS) {
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${g.name}</h2><div class="grid">${g.scenes.map(s => `<figure><img src="/previews/${s.id}.webp" alt=""><figcaption>${s.name}</figcaption></figure>`).join('')}</div>`;
  main.appendChild(sec);
}
await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
document.body.dataset.ready = '1';
</script>
</body>
</html>
