<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BetterMV 场景一览</title>
<style>
/* docs/images/scenes.jpg: the 21 scene sketches of the settings page (public/previews/, the original demo cover and
   made-up words), 7 × 3 with their names. 1760 × 600, shot at 1x and shown 880 wide in the README (so 2x there). */
@font-face { font-family: Archivo; src: url(/fonts/Archivo-w1000-700.ttf); font-weight: 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1760px; height: 600px; overflow: hidden; background: #07070a; color: #fff; font-family: "Noto Sans SC", "Microsoft YaHei UI", sans-serif; -webkit-font-smoothing: antialiased; }
.grid { display: grid; grid-template-columns: repeat(7, 228px); gap: 18px 16px; padding: 30px 32px; }
figure { position: relative; }
figure img { display: block; width: 228px; height: 128.25px; object-fit: cover; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 10px 26px rgba(0,0,0,.5); }
figcaption { margin-top: 10px; display: flex; align-items: baseline; gap: 8px; font-size: 18px; font-weight: 700; }
figcaption small { font: 700 12px Archivo; letter-spacing: .12em; color: rgba(255,255,255,.45); text-transform: uppercase; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
import { SCENES } from '../src/scenes/catalog.ts';
const grid = document.getElementById('grid');
for (const s of SCENES) {
  const f = document.createElement('figure');
  f.innerHTML = `<img src="/previews/${s.id}.webp" alt=""><figcaption>${s.name}<small>${s.id}</small></figcaption>`;
  grid.appendChild(f);
}
await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
document.body.dataset.ready = '1';
</script>
</body>
</html>
